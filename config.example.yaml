# radar configuration.
#
# Secrets are NEVER stored here. The GitLab connection reads two environment
# variables:
#   GITLAB_URL    e.g. https://gitlab.example.com
#   GITLAB_TOKEN  a personal access token with the read_api scope
#
# For QA `include_context` (radar fetches Jira tickets for you), also set:
#   JIRA_BASE_URL   e.g. https://yourco.atlassian.net
#   JIRA_EMAIL      your Atlassian account email
#   JIRA_API_TOKEN  an API token (id.atlassian.com -> Security -> API tokens)
#
# Behind a TLS-inspecting proxy (Zscaler & co.), point ONE of these at your
# organisation's root cert and radar copies it to the rest at startup — GitLab
# goes through requests and Jira through urllib, and they read different ones:
#   REQUESTS_CA_BUNDLE / CURL_CA_BUNDLE     (requests: GitLab)
#   SSL_CERT_FILE / SSL_CERT_DIR            (urllib: Jira)
# `radar check` prints a tls.ca_bundle line saying what each will trust.
#
# Copy this file to config.yaml and edit for your team.

gitlab:
  projects: # list of project paths (group/name) or numeric IDs to monitor
    - group/hub-backend
  poll_interval_minutes: 10

# Where the append-only event store lives (SQLite). Relative to CWD.
database:
  path: radar.db

# Work calendar. SLA business-hours math only consumes time inside these
# windows. Weekends and off-hours never burn SLA budget.
calendar:
  workdays: [mon, tue, wed, thu, fri]
  work_hours: { start: "09:00", end: "18:00" }
  default_timezone: America/New_York
  reviewer_timezones: # per-reviewer overrides; unmapped reviewers use the default
    someuser: Asia/Jerusalem

# SLA rules. First matching rule wins, evaluated top to bottom.
# A `match` block may constrain by target_branch (glob) and/or labels
# (obligation's MR must carry ALL listed labels). An empty match {} is the
# catch-all default and should come last.
#
# assignment_business_hours is the budget for getting ANY reviewer onto an MR
# that has none, and it is what makes such an MR visible at all: with nobody
# requested there is no review obligation to show, so before this budget exists
# the MR is simply absent from the board. Set it and each one appears with a
# "NO REVIEWERS" chip. Its clock runs from whichever came last: the MR being
# opened, being marked ready, or losing its final reviewer — so a long spell as
# a draft is never billed retroactively. An MR that was already approved gets no
# chip; it is waiting to merge, not waiting to be looked at.
#
# The key is optional, but it is all rules or none: the first matching rule wins
# outright, so a config that set it on only some of them would quietly stop
# checking MRs that match one of the others. Leave it off every rule to turn the
# check off entirely.
slas:
  - match: { target_branch: "release/*" }
    first_response_business_hours: 4
    approval_business_hours: 8
    assignment_business_hours: 2
  - match: { labels: ["hotfix"] }
    first_response_business_hours: 4
    approval_business_hours: 8
    assignment_business_hours: 2
  - match: {} # default
    first_response_business_hours: 16 # 2 business days
    approval_business_hours: 24
    assignment_business_hours: 4 # half a business day to find a reviewer

# Obligations matching any of these conditions are WAIVED (excluded from
# stats, shown blue on the board).
waive:
  draft: true
  labels: ["blocked", "do-not-review"]

# Teams. Each team is a named set of GitLab usernames. The board's VIEW bar
# then offers two filters per team: "<team> · authored" (MRs opened by a team
# member) and "<team> · to review" (MRs where a team member is a requested
# reviewer). List one or more teams; the chosen filter is remembered per browser.
teams:
  - name: backend
    members: [dan, maya, ophira]
  - name: platform
    members: [sam, priya]

# Jira association. radar recognises issue keys (PROJ-123) in each MR's branch,
# title, and description, shows them as links on the board, and passes them to
# any skill via {jira_keys}. base_url builds the browse links; project_keys is
# an optional filter so unrelated keys aren't picked up. Note this is NOT the
# credential for fetching a ticket — that is JIRA_BASE_URL/JIRA_EMAIL/
# JIRA_API_TOKEN in the environment, and the two should name the same server.
jira:
  base_url: https://yourco.atlassian.net
  project_keys: [PROJ, BUG]

# ---------------------------------------------------------------------------
# Skills — every dashboard button, in one list.
#
# A skill is an external command radar runs for one merge request, rendering its
# stdout. Each enabled entry becomes a button on every MR row and appears in
# `radar check`. The command is a template; radar fills placeholders and runs it
# locally (shell=False — never through a shell). Placeholders:
#   {web_url} {mr_iid} {project_id} {source_branch} {target_branch} {title}
#   {author} {head_sha}, plus {source_root} once the skill declares a `source:`,
#   and {jira_keys} / {jira_keys_csv} from the keys found on the MR.
#
# This list is the ONLY place a skill is declared. Two names arrive with
# defaults, because they are capabilities no command line can advertise:
#   review   context: gitlab_diff                — the MR diff is piped to STDIN
#   qa       context: jira + stores_result: true — the linked ticket(s) are piped
#            to STDIN, and the output is saved and re-openable from the board
# Defaults, not magic: write `context:` or `stores_result:` yourself and yours
# wins. Every other name starts with no capabilities at all. Declaring a skill
# anywhere else (a top-level `review:` or `qa:` block, as older versions took)
# is refused with a message telling you to move it here.
# ---------------------------------------------------------------------------
skills:
  - name: review
    enabled: false
    # Invoke a prepared Claude Code skill headlessly. Make the run smooth AND safe:
    #  1. Pre-approve a NARROW, read-only allowlist in ~/.claude/settings.json
    #     under permissions.allow — e.g.
    #       ["Read", "Grep", "Glob",
    #        "WebFetch(domain:gitlab.yourco.com)",   # code review -> GitLab
    #        "mcp__atlassian__*",                     # QA -> Jira via an Atlassian MCP
    #        "WebFetch(domain:*.atlassian.net)"]      # QA -> Jira via WebFetch (alt)
    #     For MCP tools the rule is mcp__<server>__<tool>; the "__*" wildcard
    #     approves a whole server (a bare "mcp__atlassian" is rejected). Match
    #     "atlassian" to your Jira MCP server's real name. Add "Bash(git *)" ONLY
    #     if a skill reviews a local checkout. No blanket Bash or write/edit tools.
    #     (Don't use --bare: it skips loading MCP servers.)
    #  2. --permission-mode dontAsk : enforce that allowlist WITHOUT prompting.
    #     Anything not on the list is auto-DENIED (fails closed), so the run never
    #     blocks and never silently gains capabilities.
    #     Do NOT use --permission-mode bypassPermissions: it allows everything
    #     (fails open). Only consider it inside a locked-down sandbox (container /
    #     firejail / nsjail) with no network to internal services and no secrets
    #     in the environment.
    #  3. --output-format stream-json --verbose : emit live events so the dashboard
    #     shows real-time progress. Plain commands still work (stdout -> progress
    #     log); they just aren't as granular.
    command: 'claude -p --permission-mode dontAsk --output-format stream-json --verbose "/code-review"'
    # Where to run the command. Leave null and radar runs it in the `source:`
    # checkout resolved for this MR's project (below); null with no source =
    # radar's CWD. Set it to override both (~ and $VARS expand).
    working_dir: null
    # Budget for the WHOLE job, not just the command: preparing a worktree and
    # fetching the MR's context both talk to the network and are spent from this
    # same clock, so a job can never outlast it. A slow fetch shortens what the
    # command gets rather than being added on top.
    timeout_seconds: 600
    # env / env_unset: what THIS skill's subprocess gets on top of radar's own
    # environment, and what it must not inherit. Values are exported as written
    # (`true` stays `true`); a key with no value is refused rather than guessed
    # at, which is what env_unset is for. radar's own credentials are stripped
    # from every skill and are refused in both lists. Setting PATH here is not
    # portable — Windows searches radar's PATH, not the child's — and `radar
    # check` always resolves commands against radar's own.
    #
    # Two variables are exported to every skill by default (unless you exported
    # one yourself before starting radar, in which case yours stands):
    #   CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    #   CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
    # A headless `claude -p` that hands work to a background subagent answers the
    # turn straight away with a placeholder ("I'll report the findings when it
    # completes") and reports its real findings only in a later result — if the
    # run waits for them at all. That placeholder is what would get stored as
    # your review. The first variable makes subagents run inline, so the run's
    # last word is its actual work; the second makes the CLI wait forever for
    # any background agent a skill starts anyway (the CLI's own default gives up
    # after 10 minutes), leaving timeout_seconds as the only clock. When that
    # clock runs out radar tries to take down the skill's whole process tree (a
    # background agent left behind would keep running, and spending, after the
    # job failed) — best effort, since a descendant that re-parents or starts
    # its own session is out of reach — and whatever the configuration, a run
    # the CLI itself cut short (it prints
    # "Background tasks still running" on stderr when an overridden ceiling
    # elapses) is failed rather than stored: its output is a deferral note, not
    # the review, and it appears under the error instead of posing as one.
    # The cost of inline is parallelism: work that fanned out now runs one after
    # another, so raise timeout_seconds if a skill was already close to its
    # budget. To keep the fan-out instead:
    #   env_unset: [CLAUDE_CODE_DISABLE_BACKGROUND_TASKS]
    #
    # include_context: radar fetches the MR title/description/diff itself (via
    # GITLAB_URL/GITLAB_TOKEN) and pipes it to the skill on STDIN. The skill then
    # needs NO GitLab access of its own and works on private/self-hosted GitLab —
    # write your /code-review skill to read the diff from stdin (drop {web_url}).
    include_context: false
    # context takes a list, so one skill can be handed several backends at once:
    # the diff AND the ticket that motivated it, in one document. `review`
    # already implies gitlab_diff; naming it here replaces that default.
    #   context: [gitlab_diff, jira]
    #
    # source: where this MR's project is checked out, so the skill can read the
    # code the diff came from instead of guessing from the diff alone. It arrives
    # three ways: the {source_root} placeholder, a "## Source" section on STDIN,
    # and the command's working directory (so a Claude Code skill's Read/Grep land
    # on the right tree). Machine-specific, so it comes from the environment and
    # is never committed:
    #   source: { env: HUB_REPO_ROOT }
    # radar polls several projects and one checkout can't serve them all, so it
    # also takes a mapping keyed by project path or numeric id, with a fallback:
    #   source:
    #     group/hub-backend: { env: HUB_REPO_ROOT }
    #     group/hub-web:     ~/src/hub-web
    #     "42":              /srv/checkouts/legacy
    #     default:           { env: FALLBACK_REPO }
    # Keys match the project path from the MR's URL or its numeric id. An MR whose
    # project matches nothing REFUSES to run rather than quietly reviewing without
    # a checkout — add `default:` if the skill should run without one elsewhere.
    # A root that is SET BUT WRONG refuses the job rather than launching it: every
    # read the agent tries would answer "no such file", which is indistinguishable
    # from a clean repo — it would review having opened nothing and the run would
    # look entirely normal. `radar check` reports the same thing ahead of time.
    #
    # checkout: what tree the job actually gets.
    #   none      (default) run in the `source:` checkout, on whatever branch it
    #             is sitting on — usually NOT this merge request's code, and shared
    #             by every job started from the board.
    #   worktree  give each job its own detached `git worktree` at the MR's head
    #             commit, removed when the job ends. {source_root} then names that
    #             worktree. The commit comes from GitLab's per-MR ref
    #             (refs/merge-requests/<iid>/head), which resolves even for MRs
    #             from forks, fetched from `remote:` using your own git
    #             credentials — freshly, so the tree matches the diff radar hands
    #             the skill rather than the older sha from the last poll. Your
    #             working copy is untouched (no branch, no HEAD move), and
    #             concurrent jobs get independent trees. A failed fetch FAILS THE
    #             JOB rather than falling back to the current branch — a review of
    #             the default branch presented as a review of the MR is
    #             confidently wrong about other code. Cannot be combined with
    #             working_dir: the worktree IS where the code is.
    #   checkout: worktree
    #   remote: origin
    #
    # inputs: anything else this skill needs, in three value forms:
    #   inputs:
    #     db_schema:    { file: ./references/schema.sql }  # contents, rel. to this file
    #     api_spec_url: https://internal/api/spec.json     # a literal
    #     cluster:      { env: CLUSTER_NAME, secret: false }
    #     token:        { env: SKILL_TOKEN, required: true }
    # A literal, a file's contents, and a `secret: false` env value are appended to
    # the STDIN bundle. A plain `env:` value is NOT: that bundle is prompt text for
    # an LLM agent, and a credential does not belong in a prompt or in the
    # transcript it leaves behind — the skill inherits it from radar's environment
    # instead. `required: true` refuses the job (and fails `radar check`) when the
    # variable is unset, rather than discovering it mid-run.

  # The QA test plan. Extra placeholders: {jira_keys} (space-separated) and
  # {jira_keys_csv}. Inherits context: jira and stores_result: true from its name,
  # so radar keeps a copy of the output and the board shows a re-openable badge.
  - name: qa
    enabled: false
    command: 'claude -p --permission-mode dontAsk --output-format stream-json --verbose "/qa-testplan"'
    working_dir: null
    timeout_seconds: 900
    # include_context: radar fetches the linked Jira ticket(s) — and an epic's
    # child issues — via JIRA_BASE_URL/JIRA_EMAIL/JIRA_API_TOKEN, and pipes them
    # to the skill on STDIN. The skill needs no Jira access of its own.
    include_context: false

  # A skill of your own. No name means no inherited capabilities, so anything it
  # needs is stated outright:
  #   context: gitlab_diff | jira | [both]  — with include_context, radar fetches
  #                                   those backends and pipes them to STDIN.
  #   stores_result: true          — persist the output and show a re-openable ✓
  #                                   badge (this is what qa inherits).
  #   source: / inputs:            — the declared context bag (see `review`).
  #                                   Every skill declares its own, so two skills
  #                                   on one board can point at different trees.
  - name: dba              # url/id slug; must be unique
    label: DBA review      # panel heading / long name
    button: DBA            # short button text (optional; defaults to label)
    icon: "🗄"             # button emoji (optional; defaults to ▶)
    enabled: false
    command: 'claude -p --permission-mode dontAsk --output-format stream-json --verbose "/dba"'
    working_dir: null      # null = the resolved source checkout, else radar's CWD
    timeout_seconds: 600
    # context: gitlab_diff
    # source: { env: HUB_REPO_ROOT }
    # inputs:
    #   db_schema: { file: ./references/schema.sql }

# Gamification config is consumed in Phase 3; kept here so the file is stable.
gamification:
  points:
    review_within_sla: 10
    fast_first_response_bonus: 5 # first response within 25% of SLA budget
    substantive_review_bonus: 5 # >= 2 discussion threads opened
    orphan_pickup: 8 # reviewed an MR with no assigned reviewer
    bare_approval: 2 # approval with zero comments — deliberately low
  streak_bonus_per_day: 1
